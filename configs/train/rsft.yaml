task:
  name: math_rsft
  stage: rsft
  seed: 42

paths:
  model_path: outputs/train/sft/model
  dataset_path: data/math
  output_dir: outputs/train/rsft
  final_model_dir: outputs/train/rsft/model
  rsft_data_path: outputs/train/rsft/rsft_samples.jsonl

dataset:
  split: train
  limit: null
  start_index: 0
  question_field: problem
  solution_field: solution
  metadata_fields:
    - level
    - type
  max_length: 2048
  add_eos_token: true

prompt:
  system_template: |
    # Instruction
    You are a helpful, respectful, and honest assistant.
    Below is a math problem from the MATH dataset.
    Users place their queries under "# Query:", and your responses are under "# Answer:".

    You should solve the math problem step by step.
    Your response must strictly follow this format:

    <think>
    reasoning process here
    </think> <answer>
    final answer here
    </answer>

    Important:
    - Put only the final result inside <answer>...</answer>.
    - Do not include words or explanations inside <answer>...</answer>.
    - Do not use \boxed{} inside <answer>...</answer>.
    - If the answer is a number, fraction, expression, tuple, or interval, write only that object.

  user_template: |
    # Query:
    {question}

    # Answer:
    <think>

generation:
  tensor_parallel_size: 1
  dtype: bfloat16
  gpu_memory_utilization: 0.75
  max_model_len: 2048
  trust_remote_code: true

sampling:
  temperature: 0.5
  top_p: 0.95
  max_tokens: 1024
  min_tokens: 1
  n: 8
  stop:
    - "</answer>"
  include_stop_str_in_output: true
  seed: 42

grading:
  name: r1_zero_reward_fn
  fast: false
  normalize_tag_whitespace: true

rsft:
  skip_sampling_if_exists: true
  reward_threshold: 1.0
  max_accepted_per_prompt: 1

model:
  torch_dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: true
  device_map: null
  gradient_checkpointing: true

training:
  num_train_epochs: 2
  train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  weight_decay: 0.01
  betas:
    - 0.9
    - 0.95
  eps: 1.0e-8
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  num_workers: 2
  pin_memory: true
  log_every: 10
  save_final_model: true

wandb:
  enabled: true
  env_file: .env
  run_name: rsft
  tags:
    - rsft
    - math
    - qwen2.5
  log_examples_every: 100

plots:
  enabled: true
  dpi: 300
  style: seaborn-v0_8-whitegrid
